<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>电影便当</title>
<style>
:root{--bg:#f6f3ee;--sf:#fffdf9;--ink:#201f1d;--mut:#8a8378;--ac:#c8755a;--ln:rgba(0,0,0,.06);--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC",sans-serif}
.serif{font-family:"Noto Serif SC","Songti SC","STSong",Georgia,serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.top h1{margin:0;font-size:1.55rem;font-weight:600;letter-spacing:.02em}
.seg{display:flex;background:rgba(0,0,0,.05);border-radius:999px;padding:3px}
.seg button{padding:5px 14px;border-radius:999px;font-size:.85rem;color:var(--mut)}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:9px 12px;margin-bottom:12px}
.search svg{width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:1.8;flex:0 0 auto}
.search input{flex:1;border:0;outline:0;background:none;font-size:.95rem}
.tabs{display:flex;gap:18px;margin:2px 4px 14px;font-size:.95rem}
.tabs button{color:var(--mut);padding-bottom:5px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ac)}
.view{display:none}.view.on{display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.card h2{margin:0 0 4px;font-size:1.05rem;font-weight:600}
.card .sub{color:var(--mut);font-size:.82rem;margin-bottom:10px}
/* 盲盒 */
.lid{position:relative;min-height:118px;border-radius:14px;background:#efe9df;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mut);overflow:hidden;padding:12px}
.lid[data-s=idle]{cursor:pointer}.lid[data-s=idle]:active{background:#eae3d7}
.lid .paw{position:absolute;right:-18px;bottom:-22px;width:150px;height:150px;pointer-events:none}
.lid b{font-weight:500;color:var(--ink);font-size:1rem}
.lid .s{font-size:.8rem}
.lid .idle,.lid .busy{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.lid .got{width:100%;position:relative;z-index:1}
.lid .got .item{background:var(--sf)}
.lid .redo{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:var(--sf);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center}
.lid .redo svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.lid[data-s=idle] .busy,.lid[data-s=idle] .got,.lid[data-s=idle] .redo,.lid[data-s=busy] .idle,.lid[data-s=busy] .got,.lid[data-s=busy] .redo,.lid[data-s=got] .idle,.lid[data-s=got] .busy{display:none}
.lid[data-s=got] .paw{opacity:.35}
.pack{display:flex;gap:7px}
.pack i{width:16px;height:16px;border-radius:5px;background:var(--ac);opacity:.35;animation:packPulse 1s ease-in-out infinite}
.pack i:nth-child(2){animation-delay:.15s}.pack i:nth-child(3){animation-delay:.3s}.pack i:nth-child(4){animation-delay:.45s}
@keyframes packPulse{0%,100%{transform:translateY(0) scale(1);opacity:.35}50%{transform:translateY(-8px) scale(1.08);opacity:.95}}
.reveal{animation:revealIn .38s ease}
@keyframes revealIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pack i,.reveal{animation:none}}
.today{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:.9rem}
.btn.lite{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.btn.ac{background:var(--ac)}
.row-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
/* 货架筛选 */
.fhead{display:flex;align-items:center;justify-content:space-between;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;cursor:pointer;margin-bottom:8px}
.fhead .ftxt{font-size:.88rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead svg{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;transition:transform .2s;flex:0 0 auto}
.fhead.open svg{transform:rotate(180deg)}
.fwrap{max-height:0;overflow:hidden;transition:max-height .25s ease}
.fwrap.open{max-height:700px}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.flab{flex:0 0 3em;color:var(--mut);font-size:.78rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 0;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 12px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-size:.82rem;color:var(--mut);white-space:nowrap}
.chip small{margin-left:4px;font-size:.7rem;opacity:.7}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on small{opacity:.75}
.fsum{color:var(--mut);font-size:.78rem;margin:6px 4px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px;cursor:pointer;position:relative}
.item:active{transform:scale(.995)}
.pst{width:62px;height:92px;border-radius:8px;background:#e9e3d9;object-fit:cover;flex:0 0 auto}
.it{flex:1;min-width:0}
.it .t{font-weight:600;font-size:.98rem;line-height:1.35}
.it .t span{color:var(--mut);font-weight:400;font-size:.85rem;margin-left:4px}
.it .o{color:var(--mut);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{display:inline-flex;align-items:center;gap:1px;vertical-align:-2px}
.stars svg{width:12px;height:12px;fill:#d9c9a3}
.stars svg.on{fill:var(--ac)}
.stars .num{margin-left:5px;color:var(--ac);font-size:.82rem;font-weight:600}
.it .m{color:var(--mut);font-size:.78rem;margin-top:3px}
.badge{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.badge svg{width:18px;height:18px}
.tier{display:inline-block;font-size:.7rem;color:var(--ac);border:1px solid rgba(200,117,90,.35);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:.9rem}
.more{text-align:center;margin:14px 0}
/* 全屏详情 */
.full{position:fixed;inset:0;background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;visibility:hidden}
.full.on{transform:none;visibility:visible}
.fbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--ln);flex:0 0 auto}
.fbar button{display:flex;align-items:center;gap:2px;font-size:.95rem;padding:4px 8px;border-radius:10px}
.fbar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.fbar .ft{flex:1;text-align:center;font-size:.92rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:60px}
.fbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.fin{max-width:720px;margin:0 auto;padding:18px 16px 70px;position:relative}
.dhead{display:flex;gap:14px;position:relative}
.dhead .pst{width:104px;height:154px;border-radius:10px}
.dhead .t{font-size:1.3rem;font-weight:600;line-height:1.3}
.dhead .orig{color:var(--mut);font-size:.85rem;margin-top:2px}
.dhead .m{color:var(--mut);font-size:.8rem;margin-top:8px;line-height:1.6}
.bigpaw{position:absolute;right:-40px;top:-30px;width:190px;height:190px;pointer-events:none}
.acts{display:flex;gap:10px;margin:16px 0}
.acts .btn{flex:1}
.acts .btn.on{background:#fff4ee;color:var(--ac);border:1px solid rgba(200,117,90,.5)}
.ov{font-size:.94rem;line-height:1.8;color:#3a352e}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw span{font-size:.75rem;color:var(--mut);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:2px 8px}
.done{margin-top:14px;padding:10px 12px;border-radius:12px;background:#fff4ee;color:var(--ac);font-size:.88rem;display:flex;align-items:center;gap:8px}
.done svg{width:18px;height:18px;flex:0 0 auto}
h3.sec{font-size:.9rem;color:var(--mut);font-weight:500;margin:20px 0 8px}
/* 底部抽屉(打印小票用) */
.sheet{position:fixed;inset:0;background:rgba(32,31,29,.32);display:none;z-index:60}
.sheet.on{display:block}
.pane{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px 40px;max-width:720px;margin:0 auto}
.pane .grab{width:38px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:0 auto 12px}
/* 小票 */
.rc{background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:16px;position:relative}
.rc .img{width:100%;aspect-ratio:3/2;object-fit:cover;background:#e9e3d9;display:block}
.rc .body{font-family:ui-monospace,"SF Mono",Menlo,"Noto Sans Mono CJK SC",monospace;font-size:.8rem;line-height:1.7;padding:14px 16px 18px;color:#3a352e;position:relative}
.rc .body .h{text-align:center;letter-spacing:.14em;color:var(--mut);font-size:.72rem}
.rc .body .name{text-align:center;font-size:1rem;font-weight:700;margin:6px 0 2px;letter-spacing:.02em;font-family:"Noto Serif SC","Songti SC",serif}
.rc .body .orig{text-align:center;color:var(--mut);font-size:.72rem}
.rc .dash{border-top:1px dashed rgba(0,0,0,.18);margin:10px 0}
.rc .kv{display:flex;justify-content:space-between;gap:12px}
.rc .kv span:first-child{color:var(--mut);flex:0 0 auto}
.rc .kv span:last-child{text-align:right}
.rc .q{margin:8px 0;padding-left:10px;border-left:2px solid rgba(200,117,90,.5);color:#5a534a;font-style:italic}
.rc .say{margin-top:6px}
.rc .say b{font-weight:600;color:var(--ac);margin-right:6px}
.rc .stamp{position:absolute;right:14px;bottom:14px;width:64px;height:64px;opacity:.55;transform:rotate(-14deg)}
.rc .bar{height:26px;margin-top:12px;background:repeating-linear-gradient(90deg,#2a2723 0 2px,transparent 2px 4px,#2a2723 4px 5px,transparent 5px 9px,#2a2723 9px 12px,transparent 12px 14px);opacity:.75}
.rc .foot{text-align:center;color:var(--mut);font-size:.68rem;margin-top:6px;letter-spacing:.1em}
.rc .save{position:absolute;top:10px;right:10px;background:rgba(32,31,29,.55);color:#fff;border-radius:999px;padding:4px 10px;font-size:.72rem}
.f label{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 4px}
.f input,.f textarea{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 11px;outline:0}
.f textarea{min-height:64px;resize:vertical}
.f .two{display:flex;gap:10px}.f .two>div{flex:1}
.pick{display:flex;gap:6px}.pick svg{width:26px;height:26px;fill:#d9c9a3;cursor:pointer}.pick svg.on{fill:var(--ac)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="serif">电影便当</h1>
    <div class="seg"><button class="on" id="segB">便当</button><button id="segC">影院</button></div>
  </div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="搜片名、原名或关键词" enterkeyhint="search"></div>
  <div class="tabs"><button class="on" data-v="bento">便当</button><button data-v="shelf">货架</button><button data-v="receipt">小票</button></div>

  <section class="view on" id="v-bento">
    <div class="card">
      <h2 class="serif">今日便当</h2>
      <div class="sub">盖着的时候不知道是什么,打开就知道了</div>
      <div class="lid" id="lid" data-s="idle">
        <div class="idle"><b>掀开盒盖</b><span class="s">随机一份,不重复吃过的</span></div>
        <div class="busy"><b>正在打包便当盲盒…</b><div class="pack"><i></i><i></i><i></i><i></i></div></div>
        <div class="got" id="got"></div>
        <button class="redo" id="redo" aria-label="再来一份"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
        <svg class="paw" viewBox="0 0 100 100"><g fill="#c8755a" opacity=".16"><ellipse cx="50" cy="66" rx="20" ry="16"/><circle cx="26" cy="42" r="9"/><circle cx="42" cy="30" r="9"/><circle cx="60" cy="30" r="9"/><circle cx="75" cy="42" r="9"/></g></svg>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2 class="serif">食单</h2>
      <div class="sub">记着想看的,吃过一份就划掉一份</div>
      <div class="list" id="wishlist"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2 class="serif">看过</h2>
      <div class="sub">最近吃过的,按时间从新到旧</div>
      <div class="list" id="watched"></div>
    </div>
  </section>

  <section class="view" id="v-shelf">
    <div class="fhead" id="fhead"><span class="ftxt" id="ftxt">挑菜</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="fwrap" id="fwrap">
      <div id="filters"></div>
      <div class="frow"><span class="flab">排序</span><div class="chips" id="sorts"></div></div>
    </div>
    <div class="fsum" id="fsum"></div>
    <div class="list" id="shelf"></div>
    <div class="more" id="more"></div>
  </section>

  <section class="view" id="v-receipt">
    <div id="stats" class="sub" style="color:var(--mut);font-size:.85rem;margin:0 4px 12px"></div>
    <div id="receipts"></div>
  </section>
</div>

<div class="full" id="sheet">
  <div class="fbar"><button id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>返回</button><span class="ft" id="ftitle"></span></div>
  <div class="fbody"><div class="fin" id="pane"></div></div>
</div>
<div class="sheet" id="sheet2"><div class="pane" id="pane2"></div></div>
<div class="toast" id="toast"></div>

<script>
/* 想改称呼和厅名, 只动这三行 */
const USER_NAME='我', AI_NAME='TA', HALL_NAME='电影便当';
const TOKEN=localStorage.getItem('chat_token')||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},o.headers||{});const r=await fetch(p,o);if(!r.ok)throw new Error((await r.text()).slice(0,120)||('HTTP '+r.status));return r.json()}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>';
const PAW='<svg viewBox="0 0 100 100"><g fill="#c8755a"><ellipse cx="50" cy="66" rx="20" ry="16"/><circle cx="26" cy="42" r="9"/><circle cx="42" cy="30" r="9"/><circle cx="60" cy="30" r="9"/><circle cx="75" cy="42" r="9"/></g></svg>';
const HEART='<svg viewBox="0 0 24 24" fill="none" stroke="#c8755a" stroke-width="1.8"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg>';
function stars(r,scale){const n=Math.round((r||0)/2);let h='<span class="stars">';for(let i=1;i<=5;i++)h+=STAR.replace('<svg',i<=n?'<svg class="on"':'<svg');h+=scale?'<span class="num">'+(r||0).toFixed(1)+'</span>':'';return h+'</span>'}
function stars5(n){let h='<span class="stars">';for(let i=1;i<=5;i++)h+=STAR.replace('<svg',i<=(n||0)?'<svg class="on"':'<svg');return h+'</span>'}
/* 维度说明 */
const DIMS=[['cuisine','菜系'],['dish','菜色'],['portion','分量'],['age','熟成度'],['tier','店铺']];
const ORDER={portion:['一口','小食','正餐','大份','满汉全席'],age:['刚出锅','温热','常温','陈酿','老坛'],tier:['老字号','当红','隐藏菜单','家常']};
const DESC={portion:{'一口':'40分钟内','小食':'40–80分钟','正餐':'80–130分钟','大份':'130–180分钟','满汉全席':'3小时以上'},age:{'刚出锅':'近三年','温热':'2010年代','常温':'90–00年代','陈酿':'70–80年代','老坛':'更早'},tier:{'老字号':'经典高分','当红':'近年热门','隐藏菜单':'人少分高','家常':'其他'}};
let facets=null,shelfQ={q:'',cuisine:'',dish:'',portion:'',age:'',tier:'',sort:'hot',page:1};

function foldList(box,n){const kids=[...box.children];if(kids.length<=n)return;let open=false;const btn=document.createElement('button');btn.className='btn lite';btn.style.cssText='align-self:center;margin-top:4px';const paint=()=>{kids.forEach((k,i)=>k.style.display=(open||i<n)?'':'none');btn.textContent=open?'收起':'展开全部 '+kids.length+' 部'};btn.onclick=()=>{open=!open;paint()};paint();box.append(btn)}
function pst(f,size){return f.poster?'/api/bento/poster/'+(size||'w185')+f.poster:''}
function item(f){
  const d=document.createElement('div');d.className='item';
  const meta=[f.cuisine,(f.dishes||[]).join('/'),f.portion,f.runtime?f.runtime+'分钟':''].filter(Boolean).join(' · ');
  d.innerHTML='<img class="pst" alt="" loading="lazy" src="'+pst(f)+'"><div class="it"><div class="t">'+esc(f.title)+'<span>('+(f.year||'—')+')</span>'+(f.tier&&f.tier!=='家常'?'<span class="tier">'+esc(f.tier)+'</span>':'')+'</div><div>'+stars(f.rating,true)+'</div><div class="m">'+esc(meta)+'</div><div class="o">'+esc((f.overview||'').replace(/\s+/g,' '))+'</div></div><div class="badge">'+(f.wished?HEART:'')+(f.watched?PAW:'')+'</div>';
  d.querySelector('img').onerror=function(){this.style.visibility='hidden'};
  d.onclick=()=>openFilm(f.tmdb_id);return d}

/* ---- 盲盒 ---- */
let packing=false;
async function roll(){if(packing)return;packing=true;const lid=$('#lid');lid.dataset.s='busy';const t0=Date.now();try{const r=await api('/api/bento/random?n=1');await new Promise(res=>setTimeout(res,Math.max(0,900-(Date.now()-t0))));const box=$('#got');box.innerHTML='';if(!r.items.length){box.innerHTML='<div class="empty" style="padding:10px">冰箱空了,去货架看看</div>'}else{const el=item(r.items[0]);el.classList.add('reveal');box.append(el)}lid.dataset.s='got'}catch(e){toast('打包失败: '+e.message);lid.dataset.s='idle'}packing=false}
$('#lid').onclick=(e)=>{if($('#lid').dataset.s==='idle')roll()};
$('#redo').onclick=(e)=>{e.stopPropagation();roll()};

/* ---- 食单 ---- */
async function loadWish(){const box=$('#wishlist');try{const r=await api('/api/bento/search?wished=1&size=50&sort=new');box.innerHTML='';if(!r.items.length){box.innerHTML='<div class="empty" style="padding:18px">食单还是空的。货架上看到想吃的,点「想看」就会记在这里。</div>';return}r.items.forEach(f=>box.append(item(f)));foldList(box,3)}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
  const wb=$('#watched');try{const r=await api('/api/bento/search?watched=1&size=50');wb.innerHTML='';if(!r.items.length){wb.innerHTML='<div class="empty" style="padding:18px">还没吃过。看完一部,在详情页点「看过」打张小票。</div>';return}r.items.forEach(f=>wb.append(item(f)));foldList(wb,3)}catch(e){wb.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

/* ---- 货架 ---- */
function chipRow(key,label,opts){const row=document.createElement('div');row.className='frow';row.innerHTML='<span class="flab">'+label+'</span><div class="chips"></div>';const c=row.querySelector('.chips');c.innerHTML=[['','全部','']].concat(opts).map(o=>'<button class="chip'+(shelfQ[key]===o[0]?' on':'')+'" data-v="'+esc(o[0])+'">'+esc(o[1])+(o[2]?'<small>'+esc(o[2])+'</small>':'')+'</button>').join('');c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{shelfQ[key]=b.dataset.v;shelfQ.page=1;renderFilters();fsummary();loadShelf()});return row}
function renderFilters(){const box=$('#filters');box.innerHTML='';for(const [k,label] of DIMS){let opts;if(k==='dish')opts=Object.keys(facets.dish).map(x=>[x,x,facets.dish_zh[x]||'']);else{const src=facets[k]||{};const keys=ORDER[k]?ORDER[k].filter(x=>src[x]):Object.keys(src);opts=keys.map(x=>[x,x,(DESC[k]||{})[x]||''])}box.append(chipRow(k,label,opts))}
  const s=$('#sorts');const ss=[['hot','人气'],['rating','高分'],['new','新片'],['old','老片'],['random','乱序']];s.innerHTML=ss.map(x=>'<button class="chip'+(shelfQ.sort===x[0]?' on':'')+'" data-v="'+x[0]+'">'+x[1]+'</button>').join('');s.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{shelfQ.sort=b.dataset.v;shelfQ.page=1;renderFilters();fsummary();loadShelf()})}
async function loadShelf(append){const box=$('#shelf');if(!append)box.innerHTML='<div class="empty">找菜中…</div>';try{const q=new URLSearchParams({q:shelfQ.q,cuisine:shelfQ.cuisine,dish:shelfQ.dish,portion:shelfQ.portion,age:shelfQ.age,tier:shelfQ.tier,sort:shelfQ.sort,page:String(shelfQ.page),size:'30'});const r=await api('/api/bento/search?'+q);if(!append)box.innerHTML='';const picked=DIMS.map(d=>shelfQ[d[0]]).filter(Boolean);$('#fsum').textContent=(picked.length?picked.join(' · ')+' · ':'')+(shelfQ.q?'「'+shelfQ.q+'」· ':'')+'共 '+r.total+' 部';if(!r.items.length&&!append){box.innerHTML='<div class="empty">'+(shelfQ.q?'厨房和 TMDB 都没找到「'+esc(shelfQ.q)+'」,换个写法试试':'这几格搭在一起厨房做不出来,松一格试试')+'</div>'}r.items.forEach(f=>box.append(item(f)));const m=$('#more');m.innerHTML=(r.page*30<r.total)?'<button class="btn lite" id="moreBtn">还有 '+(r.total-r.page*30)+' 部 · 再来一页</button>':(r.total?'<span style="color:var(--mut);font-size:.8rem">到底了</span>':'');const mb=$('#moreBtn');if(mb)mb.onclick=()=>{shelfQ.page++;loadShelf(true)}}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){shelfQ.q=$('#q').value.trim();shelfQ.page=1;showView('shelf');loadShelf();$('#q').blur()}});
const SORTN={hot:'人气',rating:'高分',new:'新片',old:'老片',random:'乱序'};
function fsummary(){const picked=DIMS.map(d=>shelfQ[d[0]]).filter(Boolean);const parts=picked.slice();if(shelfQ.sort!=='hot')parts.push(SORTN[shelfQ.sort]);$('#ftxt').textContent=parts.length?'挑菜 · '+parts.join(' · '):'挑菜 · 全部'}
$('#fhead').onclick=()=>{$('#fwrap').classList.toggle('open');$('#fhead').classList.toggle('open')};

/* ---- 全屏详情 ---- */
let cur=null,sheetOpen=false;
function openSheet(){$('#sheet').classList.add('on');sheetOpen=true;try{history.pushState({film:1},'')}catch(e){}}
function closeSheet(pop){$('#sheet').classList.remove('on');sheetOpen=false;if(pop&&history.state&&history.state.film)history.back()}
window.addEventListener('popstate',()=>{if(sheetOpen)closeSheet(false)});
$('#back').onclick=()=>closeSheet(true);
function openSheet2(){$('#sheet2').classList.add('on')}function closeSheet2(){$('#sheet2').classList.remove('on')}
$('#sheet2').onclick=e=>{if(e.target.id==='sheet2')closeSheet2()};
async function openFilm(id){const p=$('#pane');p.innerHTML='<div class="empty">端菜中…</div>';$('#ftitle').textContent='';openSheet();$('.fbody').scrollTop=0;try{cur=await api('/api/bento/film/'+id);renderFilm()}catch(e){p.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderFilm(){const f=cur,p=$('#pane');$('#ftitle').textContent=f.title||'';const meta=[f.cuisine,(f.genres||[]).join(' '),f.runtime?'片长'+f.runtime+'分钟':'',f.release_date?f.release_date.slice(0,10)+'上映':'',f.portion?'分量·'+f.portion:'',f.age?'熟成·'+f.age:''].filter(Boolean).join(' / ');
  const done=f.logs&&f.logs.length?f.logs[0]:null;
  p.innerHTML='<div class="dhead"><img class="pst" alt="" src="'+pst(f,'w342')+'"><div style="flex:1;min-width:0;position:relative"><div class="t serif">'+esc(f.title)+'</div><div class="orig">'+esc(f.title_orig)+' ('+(f.year||'—')+')'+(f.tier&&f.tier!=='家常'?'<span class="tier">'+esc(f.tier)+'</span>':'')+'</div><div style="margin-top:6px">'+stars(f.rating,true)+'<span style="color:var(--mut);font-size:.75rem;margin-left:6px">'+(f.votes||0)+'人</span></div><div class="m">'+esc(meta)+'</div></div><div class="bigpaw">'+PAW.replace('fill="#c8755a"','fill="#c8755a" opacity=".11"')+'</div></div>'
  +'<div class="acts"><button class="btn lite'+(f.wished?' on':'')+'" id="bWish">'+(f.wished?'已在食单':'想看')+'</button><button class="btn lite'+(done?' on':'')+'" id="bLog">'+(done?'再吃一次':'看过')+'</button><button class="btn" id="bOpen">开饭</button></div>'
  +(done?'<div class="done">'+PAW+'<span>看过了 · '+esc(done.watched_at)+(done.rating_me?' · 你打了 '+done.rating_me+' 星':'')+(done.source==='cinema'?' · 和 '+AI_NAME+' 在影院':'')+'</span></div>':'')
  +(f.tagline?'<h3 class="sec">一句话</h3><div class="ov" style="font-style:italic">'+esc(f.tagline)+'</div>':'')
  +'<h3 class="sec">简介</h3><div class="ov">'+esc(f.overview||'(暂无简介)')+'</div>'
  +((f.keywords||[]).length?'<h3 class="sec">配菜</h3><div class="kw">'+(f.keywords||[]).slice(0,14).map(k=>'<span>'+esc(k)+'</span>').join('')+'</div>':'')
  +(done?'<h3 class="sec">小票</h3><div id="dRc"></div>':'');
  p.querySelector('.dhead img').onerror=function(){this.style.visibility='hidden'};
  $('#bWish').onclick=async()=>{try{await api('/api/bento/wish',{method:'POST',body:JSON.stringify({film_id:f.tmdb_id,on:!f.wished})});f.wished=!f.wished;renderFilm();loadWish();toast(f.wished?'记进食单了':'从食单拿掉了')}catch(e){toast(e.message)}};
  $('#bLog').onclick=()=>logForm(f);
  $('#bOpen').onclick=()=>{location.href='/nest/cinema?tmdb='+f.tmdb_id};
  if(done)$('#dRc').append(receipt(Object.assign({},done,{title:f.title,title_orig:f.title_orig,year:f.year,runtime:f.runtime,poster:f.poster,backdrop:f.backdrop,cuisine:f.cuisine,dishes:f.dishes,portion:f.portion})));
}
function logForm(f){const p=$('#pane2');let rm=0,rk=0;const today=new Date();const ds=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  p.innerHTML='<div class="grab"></div><h2 class="serif" style="margin:0 0 2px">打印小票</h2><div class="sub" style="color:var(--mut);font-size:.82rem">《'+esc(f.title)+'》'+(f.year||'')+'</div><div class="f"><label>观影日期</label><input id="lDate" type="date" value="'+ds+'"><div class="two"><div><label>你打几星</label><div class="pick" id="pm"></div></div><div><label>TA打几星</label><div class="pick" id="pk"></div></div></div><div class="two"><div><label>入场心情</label><input id="lIn" placeholder="一个词"></div><div><label>散场心情</label><input id="lOut" placeholder="一个词"></div></div><label>名台词</label><input id="lQ" placeholder="记住的那一句"><label>你的一句话</label><textarea id="lMe"></textarea><label>他的一句话</label><textarea id="lK" placeholder="也可以让 AI 在聊天里用 bento log 自己写"></textarea><div class="row-actions"><button class="btn ac" id="lGo">打印</button></div></div>';
  const mk=(id,get,set)=>{const b=p.querySelector(id);b.innerHTML=STAR.repeat(5);[...b.children].forEach((s,i)=>{s.onclick=()=>{set(i+1);[...b.children].forEach((x,j)=>x.classList.toggle('on',j<get()))}})};
  mk('#pm',()=>rm,v=>rm=v);mk('#pk',()=>rk,v=>rk=v);
  $('#lGo').onclick=async()=>{try{await api('/api/bento/log',{method:'POST',body:JSON.stringify({film_id:f.tmdb_id,watched_at:$('#lDate').value,rating_me:rm||null,rating_k:rk||null,mood_in:$('#lIn').value,mood_out:$('#lOut').value,quote:$('#lQ').value,note_me:$('#lMe').value,note_k:$('#lK').value,source:'manual'})});closeSheet2();toast('小票打印好了');cur=await api('/api/bento/film/'+f.tmdb_id);renderFilm();loadReceipts();loadWish()}catch(e){toast(e.message)}};
  openSheet2()}

/* ---- 小票 ---- */
function receipt(l){const d=document.createElement('div');d.className='rc';const no=(l.watched_at||'').replace(/-/g,'')+'-'+String(l.id||0).padStart(3,'0');const img=l.backdrop?'/api/bento/poster/w780'+l.backdrop:(l.poster?'/api/bento/poster/w500'+l.poster:'');
  d.innerHTML='<img class="img" alt="" src="'+img+'"><button class="save">存成图片</button><div class="body"><div class="h">'+HALL_NAME+' · 票号 '+esc(no)+'</div><div class="name">'+esc(l.title)+'</div><div class="orig">'+esc(l.title_orig||'')+' · '+(l.year||'')+'</div><div class="dash"></div>'
  +'<div class="kv"><span>分量</span><span>'+esc([l.portion,l.runtime?l.runtime+' 分钟':''].filter(Boolean).join(' · '))+'</span></div><div class="kv"><span>菜系</span><span>'+esc([l.cuisine,(l.dishes||[]).join('/')].filter(Boolean).join(' · '))+'</span></div><div class="kv"><span>场次</span><span>'+esc(l.watched_at||'')+(l.source==='cinema'?' · 影院':'')+'</span></div><div class="kv"><span>座位</span><span>沙发 A1 · A2</span></div>'
  +((l.mood_in||l.mood_out)?'<div class="kv"><span>心情</span><span>'+esc(l.mood_in||'—')+' → '+esc(l.mood_out||'—')+'</span></div>':'')
  +(l.quote?'<div class="q">'+esc(l.quote)+'</div>':'')+'<div class="dash"></div>'
  +(l.note_me?'<div class="say"><b>'+USER_NAME+'</b>'+esc(l.note_me)+'</div>':'')+(l.note_k?'<div class="say"><b>'+AI_NAME+'</b>'+esc(l.note_k)+'</div>':'')
  +'<div class="kv" style="margin-top:8px"><span>'+USER_NAME+'</span><span>'+stars5(l.rating_me)+'</span></div><div class="kv"><span>'+AI_NAME+'</span><span>'+stars5(l.rating_k)+'</span></div>'
  +'<div class="bar"></div><div class="foot">精神食粮 · 已验票</div><div class="stamp">'+PAW+'</div></div>';
  d.querySelector('img').onerror=function(){this.style.display='none'};
  d.querySelector('.save').onclick=async(e)=>{e.stopPropagation();if(!window.html2canvas){toast('图片组件还没加载好');return}const btn=e.target;btn.style.visibility='hidden';try{const cv=await html2canvas(d,{useCORS:true,scale:2,backgroundColor:'#fff'});const a=document.createElement('a');a.download='便当小票-'+(l.title||'')+'.png';a.href=cv.toDataURL('image/png');a.click();toast('存好了')}catch(err){toast('存图失败: '+err.message)}btn.style.visibility=''};
  return d}
async function loadReceipts(){const box=$('#receipts');try{const [r,s]=await Promise.all([api('/api/bento/log'),api('/api/bento/stats')]);$('#stats').textContent=s.meals?'吃过 '+s.meals+' 份 · 一共 '+Math.round(s.minutes/60)+' 小时 · 食单还有 '+s.wish+' 份没吃':'还没有小票。看完一部,在详情页点「看过」就会打印一张。';box.innerHTML='';if(!r.items.length)return;r.items.forEach(l=>box.append(receipt(l)))}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

/* ---- 视图 ---- */
function showView(v){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));if(v==='shelf'&&!$('#shelf').children.length)loadShelf();if(v==='receipt')loadReceipts()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showView(b.dataset.v));
$('#segC').onclick=()=>{location.href='/nest/cinema'};
(async()=>{try{facets=await api('/api/bento/facets');renderFilters();loadWish();const fp=new URLSearchParams(location.search).get('film');if(fp)openFilm(+fp)}catch(e){$('#v-bento').innerHTML='<div class="empty">厨房没开门: '+esc(e.message)+'</div>'}})();
const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';document.head.append(s);
</script>
</body>
</html>
